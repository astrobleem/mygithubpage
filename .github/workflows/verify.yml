name: Verify public browser workshop
on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: public-browser-workshop
          path: windows-xt/
          if-no-files-found: error
